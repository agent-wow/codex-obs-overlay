<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex activity</title>
    <link rel="stylesheet" href="/widget.css">
    <script type="module" src="/widget.js"></script>
  </head>
  <body>
    <main class="panel" aria-label="Codex activity">
      <header><span class="heading">AGENT</span><span id="session">Codex</span></header>
      <div id="viewport" class="viewport" tabindex="0" aria-label="Session transcript"><div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></div>
      <footer><p id="status" role="status">Connecting…</p><span id="model"></span><button id="follow" type="button" hidden>Follow live</button></footer>
    </main>
  </body>
</html>
